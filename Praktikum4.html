<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum 4 - Video Offline</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      padding: 20px;
      margin: 0;
    }
    .container {
      background-color: #ffffff;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    video {
      width: 100%;
      max-width: 500px;
      border-radius: 8px;
      margin-top: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    /* Desain Tombol Kembali ke Menu Utama */
    .btn-kembali {
      display: inline-block;
      margin-top: 25px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background 0.3s;
    }
    .btn-kembali:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>TUGAS PRAKTIKUM 4</h2>
    <h3>Sistem Informasi Jaringan dan Aplikasi</h3>
    <p>video ini diambil pada saat kegiatan perlombaan, di kejurcab tepatnya di smkn1 panyingkiran</p>
    
    <video controls poster="poster.jpg">
      <source src="rafa.mp4" type="video/mp4">
      Browser kamu tidak mendukung tag video HTML5.
    </video>

    <br>
  
    <a href="index.html" class="btn-kembali">Kembali ke Menu Utama</a>
  </div>

</body>
</html>
